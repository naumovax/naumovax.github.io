baseURL = "https://naumovax.github.io/"
languageCode = "en-us"
title = "Kseniia Naumova"
theme = "PaperMod"
copyright = "[@naumovax](https://github.com/naumovax)"

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  hideFooter = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false

[params.profileMode]
  enabled = true
  title = "Kseniia Naumova (@naumovax)"
  subtitle = "<span class=\"profile-role\">Senior Network Threat Researcher at Positive Technologies</span>I research malware in network traffic and web-related threats, improve traffic analysis tools, and explore new approaches to network threat detection."
  imageUrl = "/images/profile.jpg"
  imageWidth = 360
  imageHeight = 360

  [[params.profileMode.buttons]]
    name = "Conference Talks"
    url = "/talks/"
  [[params.profileMode.buttons]]
    name = "Mentions"
    url = "/mentions/"
  [[params.profileMode.buttons]]
    name = "About"
    url = "/about/"

[params.assets]
favicon = "/favicon.svg"
favicon16x16 = "/favicon.svg"
favicon32x32 = "/favicon.svg"

[[params.socialIcons]]
  name = "x"
